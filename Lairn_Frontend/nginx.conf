server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API hacia el backend Django (servicio "web" en docker-compose).
    # El browser llama a /api y nginx lo reenvía internamente => sin CORS.
    # Videos del centro de ayuda (ADR-018): hasta 100 MB.
    location /api/evaluacion/ayuda/ {
        client_max_body_size 110m;
        proxy_pass http://web:8000/api/evaluacion/ayuda/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Entregas de tareas (hasta 20 MB) y PDF de cargues (10 MB): el
        # límite por defecto de nginx (1 MB) las rechazaba con 413.
        client_max_body_size 25m;
        proxy_pass http://web:8000/api/;
        # Las rutas de IA (generación de contenido, exámenes, laboratorios) pueden
        # tardar más que el default de nginx (60 s). Sin esto, nginx corta con 504
        # una generación lenta aunque el backend siga trabajando.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # $http_host preserva el puerto original del navegador (ej. "localhost:5173");
        # $host lo recorta, y Django usa este header para construir URLs absolutas
        # (audio_referencia, imagen de variantes, etc.) — con $host esas URLs
        # apuntaban al puerto 80 en vez del puerto real, rompiendo la reproducción.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy de archivos subidos (diagramas generados, fotos de soluciones) —
    # Django los sirve desde MEDIA_ROOT en modo DEBUG, mismo patrón que /api/.
    location /media/ {
        proxy_pass http://web:8000/media/;
        proxy_set_header Host $http_host;
    }

    # Bundles de Vite: el nombre lleva hash, así que pueden cachearse para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida cae en index.html (react-router).
    # no-cache: el navegador revalida index.html en cada carga; sin esto lo
    # cacheaba por heurística y tras un despliegue seguía pidiendo el bundle viejo.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
