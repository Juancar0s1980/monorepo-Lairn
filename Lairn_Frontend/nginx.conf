server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API hacia el backend Django (servicio "web" en docker-compose).
    # El browser llama a /api y nginx lo reenvía internamente => sin CORS.
    location /api/ {
        proxy_pass http://web:8000/api/;
        # $http_host preserva el puerto original del navegador (ej. "localhost:5173");
        # $host lo recorta, y Django usa este header para construir URLs absolutas
        # (audio_referencia, imagen de variantes, etc.) — con $host esas URLs
        # apuntaban al puerto 80 en vez del puerto real, rompiendo la reproducción.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy de archivos subidos (diagramas generados, fotos de soluciones) —
    # Django los sirve desde MEDIA_ROOT en modo DEBUG, mismo patrón que /api/.
    location /media/ {
        proxy_pass http://web:8000/media/;
        proxy_set_header Host $http_host;
    }

    # SPA: cualquier ruta desconocida cae en index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
