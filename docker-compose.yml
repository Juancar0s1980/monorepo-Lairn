# docker-compose raíz: orquesta base de datos + backend Django + frontend React.
# Se ejecuta desde la carpeta "Laboratorio Redes Neuronales/" con:
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-lairn_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2101}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend_lairn
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend_lairn:/app
    env_file:
      - ./backend_lairn/.env
    environment:
      # Estas SOBREESCRIBEN lo que venga del .env (host/puerto internos de la red docker)
      - DB_HOST=db
      - DB_PORT=5432
      # URL interna del microservicio ML dentro de la red de docker
      - ML_SERVICE_URL=http://ml:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ml:
    build: ./microservicio_ml
    restart: always
    ports:
      # Host 8002 -> contenedor 8001 (8001 del host lo usa otro proyecto).
      # El backend le habla por la red interna con http://ml:8001, no se afecta.
      - "8002:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./Lairn_Frontend
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - web

volumes:
  postgres_data:
